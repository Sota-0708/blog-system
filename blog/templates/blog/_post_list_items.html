<ul class="post-list" id="post-list">
  {% for post in posts %}
    <li>
      <a href="{% url 'post_detail' post.id %}">{{ post.title }}</a>
      <div class="post-meta">{{ post.author.username }} — {{ post.created_date|date:"Y-m-d H:i" }}</div>
    </li>
  {% empty %}
    <li>No posts found.</li>
  {% endfor %}
</ul>
