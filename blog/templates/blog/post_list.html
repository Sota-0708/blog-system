{% extends "blog/base.html" %}
{% block title %}Blog posts{% endblock %}
{% block content %}
<h1>Blog posts</h1>

<form role="search" aria-label="Search posts" onsubmit="return false;">
  <label for="id_q">Search</label>
  <input
    type="text"
    id="id_q"
    name="q"
    value="{{ form.q.value|default_if_none:'' }}"
    hx-get="{% url 'post_search' %}"
    hx-trigger="keyup changed delay:300ms, search"
    hx-target="#post-list"
    hx-swap="outerHTML"
  >
</form>

{% include "blog/_post_list_items.html" %}
{% endblock %}
